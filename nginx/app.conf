root /usr/share/nginx/html;
index index.html;
client_max_body_size 64k;
gzip on;
gzip_types application/javascript application/json image/svg+xml text/css text/plain;

location /api/ {
  limit_req zone=crm_api burst=30 nodelay;
  limit_req zone=crm_login burst=4 nodelay;
  limit_req zone=crm_refresh burst=10 nodelay;
  error_page 429 = @crm_rate_limited;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream app:8080;
  rewrite ^/api/(.*)$ /$1 break;
  proxy_pass http://$api_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  # Public edge: never trust client-supplied forwarding headers.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
}
location @crm_rate_limited {
  default_type application/json;
  add_header Retry-After 6 always;
  add_header Cache-Control "no-store" always;
  return 429 '{"statusCode":429,"message":"Слишком много запросов. Повторите через несколько секунд."}';
}
location /assets/ {
  try_files $uri =404;
  expires 1y;
  add_header Cache-Control "public, immutable";
}
location / {
  try_files $uri $uri/ /index.html;
  add_header Cache-Control "no-cache";
}
